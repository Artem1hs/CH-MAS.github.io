<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" fill="none">
  <defs>
    <linearGradient id="body" x1="268" y1="176" x2="411" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172A4B"/>
      <stop offset=".42" stop-color="#0B1931"/>
      <stop offset="1" stop-color="#030A18"/>
    </linearGradient>
    <linearGradient id="rear" x1="478" y1="240" x2="561" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183153"/>
      <stop offset=".5" stop-color="#0A1830"/>
      <stop offset="1" stop-color="#040B18"/>
    </linearGradient>
    <linearGradient id="roof" x1="347" y1="116" x2="477" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#233D65"/>
      <stop offset=".43" stop-color="#142440"/>
      <stop offset="1" stop-color="#081326"/>
    </linearGradient>
    <linearGradient id="glass" x1="409" y1="153" x2="512" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183C58"/>
      <stop offset=".45" stop-color="#0A2035"/>
      <stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <linearGradient id="edge" x1="135" y1="199" x2="632" y2="301" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A6DA8" stop-opacity=".15"/>
      <stop offset=".35" stop-color="#72ACDF" stop-opacity=".7"/>
      <stop offset=".72" stop-color="#D5EEFF"/>
      <stop offset="1" stop-color="#379BFF" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="light" x1="436" y1="263" x2="622" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5391FF"/>
      <stop offset=".48" stop-color="#B9E5FF"/>
      <stop offset="1" stop-color="#5CAFFF"/>
    </linearGradient>
    <linearGradient id="trail" x1="53" y1="427" x2="667" y2="354" gradientUnits="userSpaceOnUse">
