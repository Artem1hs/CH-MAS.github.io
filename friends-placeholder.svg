      <stop offset=".35" stop-color="#357AFF" stop-opacity=".4"/>
      <stop offset=".7" stop-color="#6CD5FF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#357AFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ground">
      <stop stop-color="#031027" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#040D20" stop-opacity=".7"/>
      <stop offset="1" stop-color="#040D20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop stop-color="#2867FF" stop-opacity=".19"/>
      <stop offset="1" stop-color="#2867FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wheel">
      <stop stop-color="#213657"/>
      <stop offset=".55" stop-color="#101C33"/>
      <stop offset="1" stop-color="#030711"/>
    </radialGradient>
    <filter id="bloom" x="-50%" y="-150%" width="200%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft" x="-40%" y="-100%" width="180%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

